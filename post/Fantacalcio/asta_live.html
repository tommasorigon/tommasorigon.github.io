<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asta</title>
<style>
:root{
  --bg:#fbfaf8; --panel:#fff; --line:#e2ded7; --ink:#1d1c1a; --mute:#6f6a63;
  --acc:#2f5d7c; --ok:#2d6a4a; --warn:#9c6b1e; --bad:#a33b3b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:10px 12px 60px}

/* ---- pannello di stato ---- */
.hud{position:sticky;top:0;z-index:30;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.05)}
.hudrow{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline}
.stat{display:flex;flex-direction:column;min-width:78px}
.stat .lab{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.stat .val{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.stat.big .val{font-size:26px;color:var(--acc)}
.cov{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:8px;
  border-top:1px dashed var(--line)}
.covitem{font-size:12px;padding:3px 8px;border-radius:6px;background:#f1efeb;
  font-variant-numeric:tabular-nums}
.covitem b{font-weight:650}
.covitem.full{background:#e2efe6;color:var(--ok)}
.covitem.thin{background:#f6e8d9;color:var(--warn)}
.covitem.mod{background:#e9e5de;color:#5a544c}

/* ---- controlli ---- */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
input[type=text],select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;
  font-size:14px;background:#fff;color:var(--ink)}
input[type=text]{flex:1;min-width:150px}
.chip{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;
  cursor:pointer;font-size:13px;user-select:none}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.mini{font-size:12px;padding:5px 9px}

/* ---- tabella ---- */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:#f4f2ee;font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--mute);text-align:right;padding:8px 7px;
  border-bottom:1px solid var(--line);white-space:nowrap}
th:nth-child(2),th:nth-child(3){text-align:left}
td{padding:6px 7px;border-bottom:1px solid #f0eeea;text-align:right;white-space:nowrap}
td:nth-child(2),td:nth-child(3){text-align:left}
tr.sold{opacity:.42}
tr.sold td.nm{text-decoration:line-through}
tr.mine{background:#eef4f8}
tr.mine td.nm{font-weight:650}
tr.fuori td{color:#9a948c}
tr.fuori td.nm{font-style:italic}
tr.nuovo{background:#faf6fb}
tr.nuovo.mine{background:#f0f2f8}
.fl{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:#a8a29a;
  border:1px solid #ddd8d0;border-radius:3px;padding:0 3px;margin-left:5px}
.fl.new{color:#7a4a86;border-color:#d9c2e0;background:#f3e9f6}

/* ---- confronto col mercato ---- */
.dl{font-variant-numeric:tabular-nums;font-weight:650}
.dl.occ{color:var(--ok)}   /* il mercato lo sottovaluta: occasione */
.dl.tra{color:var(--bad)}  /* il mercato lo sopravvaluta: trappola */
.dl.pari{color:var(--mute);font-weight:400}
.dl.nd{color:#c3bdb5;font-weight:400}
td.fvm{color:var(--mute)}
.rl{display:inline-block;width:19px;text-align:center;border-radius:4px;font-size:11px;
  font-weight:650;padding:1px 0}
.rl.P{background:#f5ecc9}.rl.D{background:#d9ead9}.rl.C{background:#d7e0f0}.rl.A{background:#f2d8d8}
.live{font-weight:650;color:var(--acc)}
.rho-lo{color:var(--bad)}.rho-md{color:var(--warn)}.rho-hi{color:var(--ok)}
.star{cursor:pointer;color:#cfc9c0;font-size:15px}
.star.on{color:#d9a520}
.px{width:56px;border:1px solid var(--line);border-radius:6px;padding:4px 5px;
  text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.b{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;
  cursor:pointer;font-size:12px;margin-left:3px}
.b.io{background:var(--acc);color:#fff;border-color:var(--acc)}
.b.x{color:var(--bad)}
.note{color:var(--mute);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">

<div class="hud">
  <div class="hudrow">
    <div class="stat big"><span class="lab">Offerta max</span><span class="val" id="s-max">-</span></div>
    <div class="stat"><span class="lab">Crediti</span><span class="val" id="s-cred">-</span></div>
    <div class="stat"><span class="lab">Slot liberi</span><span class="val" id="s-slot">-</span></div>
    <div class="stat"><span class="lab">Speso</span><span class="val" id="s-spe">-</span></div>
    <div class="stat"><span class="lab">Inflazione</span><span class="val" id="s-inf">-</span></div>
    <div class="stat"><span class="lab">Venduti lega</span><span class="val" id="s-vend">-</span></div>
  </div>
  <div class="cov" id="cov"></div>
</div>

<div class="bar">
  <input type="text" id="q" placeholder="Cerca giocatore..." autocomplete="off">
  <span class="chip on" data-r="*">Tutti</span>
  <span class="chip" data-r="P">P</span>
  <span class="chip" data-r="D">D</span>
  <span class="chip" data-r="C">C</span>
  <span class="chip" data-r="A">A</span>
  <span class="chip" id="f-star">&#9733; obiettivi</span>
  <span class="chip" id="f-sold">nascondi venduti</span>
  <span class="chip" id="f-out">nascondi fuori lista</span>
  <span class="chip" id="f-new">solo nuovi</span>
  <span class="chip" id="f-occ">solo sottovalutati</span>
  <select id="ord">
    <option value="live">ordina: prezzo modello</option>
    <option value="fvm">ordina: Fantacalcio.it</option>
    <option value="scarto">ordina: &Delta; (sottovalutati prima)</option>
    <option value="v">ordina: fantavoto</option>
    <option value="rho">ordina: P(schierato)</option>
    <option value="nome">ordina: nome</option>
  </select>
</div>

<div class="scroll">
<table>
<thead><tr>
  <th style="width:22px"></th><th>Giocatore</th><th>Sq</th><th>R</th>
  <th>Fv</th><th>P(gioca)</th><th>P(schier.)</th>
  <th title="Prezzo del mio modello, calcolato prima dell'asta">Modello</th>
  <th title="Lo stesso prezzo, riscalato per i crediti ancora in circolazione">Modello ora</th>
  <th title="FVM di Fantacalcio.it, riscalato sullo stesso monte">Fantacalcio.it</th>
  <th title="Modello meno Fantacalcio.it">&Delta;</th><th>Azione</th>
</tr></thead>
<tbody id="tb"></tbody>
</table>
</div>

<div class="bar" style="margin-top:10px">
  <span class="chip mini" id="exp">esporta backup</span>
  <label class="chip mini">importa backup<input type="file" id="imp" accept=".json" hidden></label>
  <span class="chip mini" id="rst">azzera tutto</span>
</div>

<div class="note" id="note"></div>
</div>

"Parma","ruolo":"P","v":4.89,"pi":0.49,"rho":0.364,"prof":4,"prezzo":1,"fuori":1,"nuovo":0,"fvm":10.9,"scarto":-9.9},{"id":505,"nome":"Paleari","sq":"Torino","ruolo":"P","v":4.82,"pi":0.362,"rho":0.265,"prof":4,"prezzo":1,"fuori":1,"nuovo":0,"fvm":0.5,"scarto":0.5}]};
const P = DATA.params, PL = DATA.players;
const RUOLI = ["P","D","C","A"];
const KEY = "asta_" + PL.length + "_" + P.budget;
const SOGLIA = 10;               // crediti di scarto oltre i quali segnalo
let S = {sold:{}, star:{}};
let filtro = {r:"*", q:"", star:false, hideSold:false, hideOut:false,
              onlyNew:false, onlyOcc:false, ord:"live"};

/* scarto = listino - mercato. >0 il mercato lo sottovaluta (occasione).
   Per i nuovi il listino e' STIMATO da FVM, quindi il confronto non dice nulla. */
function stato(p){
  if(p.nuovo || p.scarto === null || p.scarto === undefined) return "nd";
  if(p.scarto >  SOGLIA) return "occ";
  if(p.scarto < -SOGLIA) return "tra";
  return "pari";
}

/* ---- persistenza ---- */
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const x=localStorage.getItem(KEY); if(x) S=JSON.parse(x); }catch(e){} }
load();

/* ---- Poisson-binomiale: P(somma <= k) ---- */
function pbCdf(ps, k){
  if(k < 0) return 0;
  let d = [1];
  for(const p of ps){
    const nd = new Array(d.length+1).fill(0);
    for(let i=0;i<d.length;i++){ nd[i] += d[i]*(1-p); nd[i+1] += d[i]*p; }
    d = nd;
  }
  let s = 0;
  for(let i=0;i<=Math.min(k, d.length-1);i++) s += d[i];
  return s;
}

/* ---- stato derivato ---- */
function calc(){
  const ids = Object.keys(S.sold);
  let spesoLega = 0, mioSpeso = 0, nMiei = 0;
  for(const id of ids){
    const s = S.sold[id];
    spesoLega += s.p;
    if(s.mine){ mioSpeso += s.p; nMiei++; }
  }
  const slotRosa = RUOLI.reduce((a,r)=> a + P.rosa[r], 0);
  const creditiResLega = P.n_squadre*P.budget - spesoLega;
  const slotResLega    = P.n_squadre*slotRosa - ids.length;

  let valResiduo = 0;
  for(const p of PL) if(!S.sold[p.id]) valResiduo += (p.prezzo - 1);
  const infl = (creditiResLega - slotResLega) / Math.max(valResiduo, 1);

  const mioRes   = P.budget - mioSpeso;
  const slotMiei = slotRosa - nMiei;
  const maxOff   = mioRes - Math.max(slotMiei - 1, 0);

  return {infl, mioRes, mioSpeso, slotMiei, maxOff, nVend: ids.length,
          totVend: P.n_squadre*slotRosa};
}

function live(p, infl){ return Math.max(1, Math.round(1 + infl*(p.prezzo-1))); }

/* ---- copertura effettiva del mio reparto ---- */
function copertura(){
  return RUOLI.map(r=>{
    const mine = PL.filter(p => S.sold[p.id] && S.sold[p.id].mine && p.ruolo===r)
                   .sort((a,b)=> b.v - a.v);
    let tot = 0;
    mine.forEach((p,i)=>{ tot += p.pi * pbCdf(mine.slice(0,i).map(x=>x.pi), P.modulo[r]-1); });
    return {r, val:tot, tgt:P.modulo[r], n:mine.length, max:P.rosa[r]};
  });
}

/* ---- rendering ---- */
function renderHud(){
  const c = calc();
  document.getElementById("s-max").textContent  = c.maxOff;
  document.getElementById("s-cred").textContent = c.mioRes;
  document.getElementById("s-slot").textContent = c.slotMiei;
  document.getElementById("s-spe").textContent  = c.mioSpeso;
  document.getElementById("s-inf").textContent  = c.infl.toFixed(2);
  document.getElementById("s-vend").textContent = c.nVend + "/" + c.totVend;

  const mod = ["D","C","A"].map(r => P.modulo[r]).join("-");
  document.getElementById("cov").innerHTML =
    `<span class="covitem mod">modulo <b>${mod}</b></span>`
    + copertura().map(x=>{
        const pieno = x.val >= x.tgt - 0.15;
        const magro = x.n > 0 && !pieno;
        return `<span class="covitem ${pieno?"full":(magro?"thin":"")}">`
             + `<b>${x.r}</b> ${x.n}/${x.max} &nbsp;copertura ${x.val.toFixed(2)}/${x.tgt}</span>`;
      }).join("");
  return c;
}

function renderTable(infl){
  let rows = PL.slice();
  if(filtro.r !== "*")  rows = rows.filter(p => p.ruolo === filtro.r);
  if(filtro.star)       rows = rows.filter(p => S.star[p.id]);
  if(filtro.hideSold)   rows = rows.filter(p => !S.sold[p.id]);
  if(filtro.hideOut)    rows = rows.filter(p => !p.fuori);
  if(filtro.onlyNew)    rows = rows.filter(p => p.nuovo);
  if(filtro.onlyOcc)    rows = rows.filter(p => stato(p) === "occ");
  if(filtro.q){
    const q = filtro.q.toLowerCase();
    rows = rows.filter(p => p.nome.toLowerCase().includes(q) ||
                            (p.sq||"").toLowerCase().includes(q));
  }
  const ord = filtro.ord;
  const sc = p => (p.nuovo || p.scarto == null) ? -Infinity : p.scarto;
  const fv = p => p.fvm == null ? -Infinity : p.fvm;
  rows.sort((a,b)=> ord==="nome"   ? a.nome.localeCompare(b.nome)
                  : ord==="v"      ? b.v - a.v
                  : ord==="rho"    ? b.rho - a.rho
                  : ord==="scarto" ? sc(b) - sc(a)
                  : ord==="fvm"    ? fv(b) - fv(a)
                  : b.prezzo - a.prezzo);

  const html = rows.map(p=>{
    const s  = S.sold[p.id];
    const lv = live(p, infl);
    const rc = p.rho < 0.30 ? "rho-lo" : (p.rho < 0.60 ? "rho-md" : "rho-hi");
    const az = s
      ? `<span style="color:var(--mute)">${s.mine?"tuo":"altri"} @ ${s.p}</span>`
        + `<button class="b x" data-und="${p.id}">&#10005;</button>`
      : `<input class="px" type="number" min="1" value="${lv}" data-in="${p.id}">`
        + `<button class="b io" data-buy="${p.id}" data-m="1">io</button>`
        + `<button class="b" data-buy="${p.id}" data-m="0">altri</button>`;
    const st = stato(p);
    const dl = st === "nd" ? "&mdash;"
             : (p.scarto > 0 ? "+" : "") + p.scarto.toFixed(0);
    const cls = [p.fuori?"fuori":"", p.nuovo?"nuovo":"",
                 s?"sold":"", s&&s.mine?"mine":""].join(" ");
    return `<tr class="${cls}">`
      + `<td><span class="star ${S.star[p.id]?"on":""}" data-st="${p.id}">&#9733;</span></td>`
      + `<td class="nm">${p.nome}`
      +   `${p.nuovo?'<span class="fl new" title="Nessuno storico: fantavoto e prezzo stimati da FVM">new</span>':""}`
      +   `${p.fuori?'<span class="fl">fuori</span>':""}</td>`
      + `<td>${p.sq||""}</td>`
      + `<td><span class="rl ${p.ruolo}">${p.ruolo}</span></td>`
      + `<td>${p.v.toFixed(2)}</td><td>${p.pi.toFixed(2)}</td>`
      + `<td class="${rc}">${p.rho.toFixed(2)}</td>`
      + `<td>${p.prezzo}</td>`
      + `<td class="live">${lv}</td>`
      + `<td class="fvm">${p.fvm == null ? "&mdash;" : p.fvm.toFixed(0)}</td>`
      + `<td class="dl ${st}">${dl}</td>`
      + `<td>${az}</td></tr>`;
  }).join("");

  document.getElementById("tb").innerHTML = html;

  const nOcc = PL.filter(p => !S.sold[p.id] && !p.fuori && stato(p)==="occ").length;
  const nTra = PL.filter(p => !S.sold[p.id] && !p.fuori && stato(p)==="tra").length;
  document.getElementById("note").innerHTML =
    `<b>Modello</b>: quanto vale per il mio modello, a inizio asta. `
    + `<b>Modello ora</b>: lo stesso prezzo riscalato per i crediti ancora in giro `
    + `(sale se la lega sta spendendo poco). `
    + `<b>Fantacalcio.it</b>: il loro FVM, riportato sullo stesso monte.<br>`
    + `<b>&Delta;</b> = Modello \u2212 Fantacalcio.it: `
    + `<b class="dl occ">+${SOGLIA}</b> o piu' = per me vale piu' di quanto dicono loro, `
    + `<b class="dl tra">\u2212${SOGLIA}</b> o meno = lo pagano piu' di quanto valga. `
    + `Ancora liberi: ${nOcc} sottovalutati, ${nTra} sopravvalutati.<br>`
    + `I <span class="fl new">new</span> non hanno storico: per loro il fantavoto e' `
    + `stimato proprio da FVM, quindi il &Delta; non direbbe nulla. `
    + `${rows.length} giocatori mostrati &mdash; lambda = ${P.lambda} `
    + `crediti per punto di fantavoto a giornata.`;
}

function render(){ const c = renderHud(); renderTable(c.infl); save(); }

/* ---- eventi ---- */
document.getElementById("tb").addEventListener("click", e=>{
  const t = e.target;
  if(t.dataset.st){ const i=t.dataset.st; S.star[i]=!S.star[i]; render(); }
  else if(t.dataset.buy){
    const i = t.dataset.buy;
    const box = document.querySelector(`[data-in="${i}"]`);
    const p = parseInt(box && box.value, 10);
    if(!p || p < 1) return;
    const mine = t.dataset.m === "1";
    const pl = PL.find(x => String(x.id) === String(i));
    if(mine && pl.fuori && p > 1 &&
       !confirm("Fuori lista: il modello lo valuta 1 credito. Pagare " + p + "?")) return;
    S.sold[i] = {p, mine};
    render();
  }
  else if(t.dataset.und){ delete S.sold[t.dataset.und]; render(); }
});
document.querySelectorAll(".chip[data-r]").forEach(c=>{
  c.onclick = ()=>{
    document.querySelectorAll(".chip[data-r]").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); filtro.r = c.dataset.r; render();
  };
});
document.getElementById("f-star").onclick = function(){
  filtro.star = !filtro.star; this.classList.toggle("on"); render(); };
document.getElementById("f-sold").onclick = function(){
  filtro.hideSold = !filtro.hideSold; this.classList.toggle("on"); render(); };
document.getElementById("f-out").onclick = function(){
  filtro.hideOut = !filtro.hideOut; this.classList.toggle("on"); render(); };
document.getElementById("f-new").onclick = function(){
  filtro.onlyNew = !filtro.onlyNew; this.classList.toggle("on"); render(); };
document.getElementById("f-occ").onclick = function(){
  filtro.onlyOcc = !filtro.onlyOcc; this.classList.toggle("on"); render(); };
document.getElementById("q").oninput    = function(){ filtro.q = this.value; render(); };
document.getElementById("ord").onchange = function(){ filtro.ord = this.value; render(); };

document.getElementById("exp").onclick = ()=>{
  const b = new Blob([JSON.stringify(S)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "asta_backup.json"; a.click();
};
document.getElementById("imp").onchange = function(e){
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ try{ S = JSON.parse(rd.result); render(); }
                    catch(err){ alert("File non valido"); } };
  rd.readAsText(f);
};
document.getElementById("rst").onclick = ()=>{
  if(confirm("Azzerare tutti gli acquisti?")){ S = {sold:{}, star:{}}; render(); }
};

render();
</script>
</body>
</html>
